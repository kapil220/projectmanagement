<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Gradient and Soft Shadow -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#logo-grad)" filter="drop-shadow(0px 8px 16px rgba(234, 88, 12, 0.35))" />
  <!-- Elegant check symbol + sheet lines in White -->
  <path d="M30 52 L45 67 L72 35" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
